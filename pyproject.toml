[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-monitor-flash"
version = "0.1.0"
description = "Experimental native Linux firmware tool for the MSI MPG 321URX monitor"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.3,<2"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
msi-monitor-flash = "msi_flash.cli:main"

[tool.setuptools.packages.find]
include = ["msi_flash*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "LOG"]
